name: Validar e Publicar Projetos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: projetos-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validar Portal de Projetos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar estrutura
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/projects.json
          test -f public/app.js
          test -f public/styles.css
          test -f Dockerfile
          test -f nginx.conf
          python3 -m json.tool public/projects.json >/dev/null

      - name: Build Docker
        run: docker build -t projetos-ci:test .

      - name: Teste HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name projetos-ci -p 127.0.0.1:18080:80 projetos-ci:test
          trap 'docker rm -f projetos-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs projetos-ci
          exit 1

  deploy:
    name: Publicar projetos.mskpoeira.com.br
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código validado
        uses: actions/checkout@v5

      - name: Criar pacote de release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="$(mktemp -d)"
          rsync -av             --exclude '.git/'             --exclude '.github/'             --exclude 'release-projetos.tar.gz'             ./ "$RELEASE_DIR/"
          tar -czf release-projetos.tar.gz -C "$RELEASE_DIR" .
          rm -rf "$RELEASE_DIR"

      - name: Transferir release para o VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "10m"
          source: "release-projetos.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: Implantar portal isolado
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_IP || '77.37.40.81' }}
          username: ${{ secrets.HOSTINGER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: "120s"
          command_timeout: "20m"
          script: |
            set -eu

            APP_DIR=/app/projetos
            IMAGE_NEW=projetos-app:candidate
            IMAGE_LATEST=projetos-app:latest
            IMAGE_ROLLBACK=projetos-app:rollback
            CONTAINER=projetos-app
            CANDIDATE=projetos-candidate
            PROXY_CONTAINER=sgr-proxy-prod

            mkdir -p "$APP_DIR"
            mv -f /tmp/release-projetos.tar.gz "$APP_DIR/"
            cd "$APP_DIR"
            tar -xzf release-projetos.tar.gz
            rm -f release-projetos.tar.gz

            NET=''
            if docker inspect "$PROXY_CONTAINER" >/dev/null 2>&1; then
              NET=$(docker inspect -f '{{range $name, $cfg := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$PROXY_CONTAINER" | grep -Ev '^(bridge|host|none)$' | head -n 1 || true)
            fi

            if [ -z "$NET" ]; then
              echo 'ERRO: rede Docker do proxy não encontrada.'
              docker network ls || true
              exit 1
            fi

            OLD_IMAGE=$(docker inspect -f '{{.Image}}' "$CONTAINER" 2>/dev/null || true)
            if [ -n "$OLD_IMAGE" ]; then
              docker tag "$OLD_IMAGE" "$IMAGE_ROLLBACK" || true
            fi

            docker build -t "$IMAGE_NEW" .

            docker rm -f "$CANDIDATE" >/dev/null 2>&1 || true
            docker run -d               --name "$CANDIDATE"               --network "$NET"               "$IMAGE_NEW"

            READY=0
            for i in $(seq 1 20); do
              if docker exec "$CANDIDATE" wget -qO- http://127.0.0.1/healthz | grep -qx 'ok'; then
                READY=1
                break
              fi
              sleep 1
            done

            if [ "$READY" -ne 1 ]; then
              echo 'Candidato não passou no health-check.'
              docker logs --tail 100 "$CANDIDATE" || true
              docker rm -f "$CANDIDATE" || true
              exit 1
            fi
            docker rm -f "$CANDIDATE"

            docker tag "$IMAGE_NEW" "$IMAGE_LATEST"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d               --name "$CONTAINER"               --restart always               --network "$NET"               --network-alias projetos               "$IMAGE_LATEST"

            docker exec "$PROXY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile || true

            ONLINE=0
            for i in $(seq 1 15); do
              if curl --fail --silent --show-error --location --max-time 15 https://projetos.mskpoeira.com.br/healthz | grep -qx 'ok'; then
                ONLINE=1
                break
              fi
              echo "Tentativa pública $i/15..."
              sleep 4
            done

            if [ "$ONLINE" -eq 1 ]; then
              echo 'PORTAL DE PROJETOS ONLINE.'
              docker image rm "$IMAGE_ROLLBACK" >/dev/null 2>&1 || true
              exit 0
            fi

            echo 'Falha na validação pública; iniciando rollback.'
            docker logs --tail 120 "$CONTAINER" || true
            docker rm -f "$CONTAINER" || true

            if docker image inspect "$IMAGE_ROLLBACK" >/dev/null 2>&1; then
              docker run -d                 --name "$CONTAINER"                 --restart always                 --network "$NET"                 --network-alias projetos                 "$IMAGE_ROLLBACK"
              docker exec "$PROXY_CONTAINER" caddy reload --config /etc/caddy/Caddyfile || true
              echo 'Rollback executado.'
            fi
            exit 1
