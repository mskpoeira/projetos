name: Validar Projetos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Portal de Projetos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar estrutura
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/projects.json
          test -f public/app.js
          test -f public/styles.css
          test -f Dockerfile
          test -f nginx.conf
          test -f scripts/validate_catalog.py
          test -f ops/projetos-sync
          test -f ops/projetos-sync.service
          test -f ops/projetos-sync.timer

      - name: Validar catálogo
        run: python3 scripts/validate_catalog.py

      - name: Validar JavaScript
        run: node --check public/app.js

      - name: Build Docker
        run: docker build -t projetos-ci:test .

      - name: Teste HTTP
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name projetos-ci -p 127.0.0.1:18080:80 projetos-ci:test
          trap 'docker rm -f projetos-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              curl --fail --silent http://127.0.0.1:18080/ >/dev/null
              curl --fail --silent http://127.0.0.1:18080/projects.json | python3 -m json.tool >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs projetos-ci
          exit 1

      - name: Publicação automática
        if: github.event_name != 'pull_request'
        run: echo "O VPS sincroniza a branch main automaticamente pelo projetos-sync.timer."
